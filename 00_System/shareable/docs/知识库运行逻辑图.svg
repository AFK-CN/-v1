<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1380" viewBox="0 0 1900 1380">
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .sub { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5563; }
      .lane-title { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #374151; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5563; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .entry { fill: #ecfdf5; stroke: #86efac; }
      .route { fill: #eff6ff; stroke: #93c5fd; }
      .agent { fill: #fff7ed; stroke: #fdba74; }
      .asset { fill: #f8fafc; stroke: #94a3b8; }
      .skill { fill: #fdf2f8; stroke: #f9a8d4; }
      .out { fill: #fefce8; stroke: #fde047; }
      .rule { fill: #fff1f2; stroke: #fda4af; }
      .lane { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; rx: 16; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #94a3b8; stroke-width: 1.8; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1380"/>
  <text class="title" x="60" y="60">知识库运行逻辑图 v2026-06-22</text>
  <text class="sub" x="60" y="92">按当前已生效入口、总控路由、智能体、active Skill、账号中心和脚本工作流整理。重点看路径和边界。</text>

  <rect class="lane" x="40" y="120" width="1820" height="180"/>
  <text class="lane-title" x="60" y="155">1. 入口层：所有调用先进入总控</text>
  <rect class="card entry" x="70" y="180" width="250" height="86"/>
  <text class="box-title" x="92" y="210">用户 / Codex / 其他项目</text>
  <text class="box-text" x="92" y="238">只需要提出需求</text>
  <rect class="card entry" x="380" y="170" width="310" height="106"/>
  <text class="box-title" x="402" y="202">@知识库 + 需求</text>
  <text class="box-text" x="402" y="230">兼容入口：knowledge-base</text>
  <text class="box-text" x="402" y="254">高级入口：出选题 / 写文案 / 复盘 / 入库</text>
  <rect class="card entry" x="750" y="170" width="330" height="106"/>
  <text class="box-title" x="772" y="202">知识库入口 + 用户操作台</text>
  <text class="box-text" x="772" y="230">先读入口规则</text>
  <text class="box-text" x="772" y="254">缺最低信息时最多反问 3 个问题</text>
  <rect class="card entry" x="1140" y="170" width="350" height="106"/>
  <text class="box-title" x="1162" y="202">已生效 Skill 包</text>
  <text class="box-text" x="1162" y="230">00_System/shareable/skill_packages/知识库</text>
  <text class="box-text" x="1162" y="254">兼容：skill_packages/knowledge-base</text>
  <rect class="card route" x="1550" y="170" width="250" height="106"/>
  <text class="box-title" x="1572" y="202">总控智能体</text>
  <text class="box-text" x="1572" y="230">controller_routes.json</text>
  <text class="box-text" x="1572" y="254">先判任务，再调度</text>
  <path class="arrow" d="M320 223 H380"/>
  <path class="arrow" d="M690 223 H750"/>
  <path class="arrow" d="M1080 223 H1140"/>
  <path class="arrow" d="M1490 223 H1550"/>

  <rect class="lane" x="40" y="325" width="1820" height="235"/>
  <text class="lane-title" x="60" y="360">2. 总控路由层：先命中任务类型，再按需读取小范围知识</text>
  <rect class="card route" x="70" y="390" width="290" height="120"/>
  <text class="box-title" x="92" y="422">任务索引</text>
  <text class="box-text" x="92" y="450">task_entry_index.md</text>
  <text class="box-text" x="92" y="474">account_knowledge_index.*</text>
  <text class="box-text" x="92" y="498">必要时才用 knowledge_index.json</text>
  <rect class="card route" x="420" y="390" width="190" height="58"/><text class="box-title" x="448" y="425">出选题</text>
  <rect class="card route" x="640" y="390" width="190" height="58"/><text class="box-title" x="662" y="425">写文案/口播</text>
  <rect class="card route" x="860" y="390" width="190" height="58"/><text class="box-title" x="902" y="425">账号学习</text>
  <rect class="card route" x="1080" y="390" width="190" height="58"/><text class="box-title" x="1120" y="425">JSON 入库</text>
  <rect class="card route" x="420" y="470" width="190" height="58"/><text class="box-title" x="450" y="505">截图复盘</text>
  <rect class="card route" x="640" y="470" width="190" height="58"/><text class="box-title" x="670" y="505">表格复盘</text>
  <rect class="card route" x="860" y="470" width="190" height="58"/><text class="box-title" x="895" y="505">Skill 沉淀</text>
  <rect class="card route" x="1080" y="470" width="190" height="58"/><text class="box-title" x="1105" y="505">系统审计/外调</text>
  <rect class="card agent" x="1340" y="385" width="450" height="150"/>
  <text class="box-title" x="1362" y="417">路由决定后调度智能体</text>
  <text class="box-text" x="1362" y="445">controller / planner / retriever / workflow_runner</text>
  <text class="box-text" x="1362" y="469">account_knowledge / content_generator</text>
  <text class="box-text" x="1362" y="493">review / skill_evolution / auditor</text>
  <text class="small" x="1362" y="517">智能体声明：00_System/shareable/skill_packages/知识库/agents/openai.yaml</text>
  <path class="arrow" d="M215 300 V390"/>
  <path class="arrow" d="M360 450 H420"/>
  <path class="arrow" d="M1270 450 H1340"/>

  <rect class="lane" x="40" y="585" width="1820" height="330"/>
  <text class="lane-title" x="60" y="620">3. 主路径 A：内容生产，正式知识为主，候选证据为辅</text>
  <rect class="card asset" x="70" y="655" width="340" height="150"/>
  <text class="box-title" x="92" y="687">正式知识层</text>
  <text class="box-text" x="92" y="715">02 爆款方法论 / 03 选题灵感 / 04 平台知识</text>
  <text class="box-text" x="92" y="739">06 子库与账号中心 / 08 内容模板</text>
  <text class="box-text" x="92" y="763">12 用户偏好 / 13 active Skill</text>
  <text class="small" x="92" y="787">这是长期可复用知识</text>
  <rect class="card asset" x="470" y="655" width="360" height="150"/>
  <text class="box-title" x="492" y="687">账号中心</text>
  <text class="box-text" x="492" y="715">账号索引 / 内容生产使用说明</text>
  <text class="box-text" x="492" y="739">减少 AI 味规则 / 内容输出模板</text>
  <text class="box-text" x="492" y="763">方向方法论 / cards / transcripts</text>
  <rect class="card asset" x="890" y="655" width="330" height="150"/>
  <text class="box-title" x="912" y="687">候选检索</text>
  <text class="box-text" x="912" y="715">tools.kb.cli search-candidates</text>
  <text class="box-text" x="912" y="739">10_Knowledge/candidates/generated_assets</text>
  <text class="box-text" x="912" y="763">只作证据和灵感，不等于正式知识</text>
  <rect class="card agent" x="1280" y="655" width="220" height="150"/>
  <text class="box-title" x="1302" y="687">内容生成智能体</text>
  <text class="box-text" x="1302" y="715">选题、文案、口播</text>
  <text class="box-text" x="1302" y="739">标题、封面方向</text>
  <text class="box-text" x="1302" y="763">必须带方法论和证据</text>
  <rect class="card out" x="1560" y="655" width="250" height="150"/>
  <text class="box-title" x="1582" y="687">内容输出</text>
  <text class="box-text" x="1582" y="715">选题 / 抖音口播 / 小红书图文</text>
  <text class="box-text" x="1582" y="739">证据来源 / 原链接</text>
  <text class="box-text" x="1582" y="763">不能直接反写正式知识</text>
  <path class="arrow" d="M410 730 H470"/>
  <path class="arrow" d="M830 730 H890"/>
  <path class="arrow" d="M1220 730 H1280"/>
  <path class="arrow" d="M1500 730 H1560"/>
  <text class="small" x="80" y="852">适用路由：出选题、写文案/口播、其他项目调用。账号/风格任务优先走账号中心，不只读通用方法论。</text>

  <rect class="lane" x="40" y="940" width="1820" height="245"/>
  <text class="lane-title" x="60" y="975">4. 主路径 B：学习、入库和脚本批处理，先候选后审核</text>
  <rect class="card rule" x="70" y="1010" width="280" height="120"/>
  <text class="box-title" x="92" y="1042">受保护原始资料</text>
  <text class="box-text" x="92" y="1070">00_Inbox / 数据/ / JSON / 截图 / 表格 / 视频</text>
  <text class="box-text" x="92" y="1094">只读，不删除，不修改</text>
  <rect class="card asset" x="400" y="1010" width="285" height="120"/>
  <text class="box-title" x="422" y="1042">清洗与视频学习</text>
  <text class="box-text" x="422" y="1070">01_Case_Cleaning</text>
  <text class="box-text" x="422" y="1094">video_learning：粗扫 -> 深学 -> 学习卡</text>
  <rect class="card skill" x="735" y="1010" width="300" height="120"/>
  <text class="box-title" x="757" y="1042">当前 active Skill</text>
  <text class="box-text" x="757" y="1070">JSON 入库 / 截图复盘 / 表格复盘</text>
  <text class="box-text" x="757" y="1094">视频深度学习</text>
  <rect class="card agent" x="1085" y="1010" width="300" height="120"/>
  <text class="box-title" x="1107" y="1042">工作流执行器 + 审计器</text>
  <text class="box-text" x="1107" y="1070">tools.kb.cli / tools.video_learning</text>
  <text class="box-text" x="1107" y="1094">tasks / state / logs / reports</text>
  <rect class="card asset" x="1435" y="1010" width="330" height="120"/>
  <text class="box-title" x="1457" y="1042">候选资产 / 审核清单</text>
  <text class="box-text" x="1457" y="1070">先进入 assets、reports 或 video_learning</text>
  <text class="box-text" x="1457" y="1094">用户确认后才进入账号中心或正式知识</text>
  <path class="arrow" d="M350 1070 H400"/>
  <path class="arrow" d="M685 1070 H735"/>
  <path class="arrow" d="M1035 1070 H1085"/>
  <path class="arrow" d="M1385 1070 H1435"/>

  <rect class="lane" x="40" y="1210" width="1820" height="130"/>
  <text class="lane-title" x="60" y="1245">5. 反馈与进化闭环：表现数据可以改变规则，但不能绕过 proposal</text>
  <rect class="card out" x="70" y="1270" width="240" height="52"/><text class="box-title" x="92" y="1304">发布与观察</text>
  <rect class="card out" x="360" y="1270" width="310" height="52"/><text class="box-title" x="382" y="1304">09 反馈 / 10 周复盘 / 12 偏好</text>
  <rect class="card agent" x="720" y="1270" width="210" height="52"/><text class="box-title" x="746" y="1304">复盘智能体</text>
  <rect class="card agent" x="980" y="1270" width="230" height="52"/><text class="box-title" x="1006" y="1304">Skill 沉淀智能体</text>
  <rect class="card skill" x="1260" y="1270" width="230" height="52"/><text class="box-title" x="1284" y="1304">proposals</text>
  <rect class="card skill" x="1540" y="1270" width="250" height="52"/><text class="box-title" x="1566" y="1304">用户确认后 active</text>
  <path class="arrow" d="M310 1296 H360"/>
  <path class="arrow" d="M670 1296 H720"/>
  <path class="arrow" d="M930 1296 H980"/>
  <path class="arrow" d="M1210 1296 H1260"/>
  <path class="arrow" d="M1490 1296 H1540"/>
  <path class="soft-arrow" d="M1665 1270 C1670 1180 1640 1160 1600 1130"/>
  <text class="small" x="1600" y="1168">确认后回到总控路由和清洗规则</text>

  <rect class="card rule" x="1480" y="35" width="360" height="100"/>
  <text class="box-title" x="1502" y="66">全局硬边界</text>
  <text class="small" x="1502" y="90">索引优先；默认不全盘扫库，不读数据/、00_Inbox、99_Archive</text>
  <text class="small" x="1502" y="112">候选不等于正式；内容输出不反写正式知识；active Skill 需确认</text>
</svg>
